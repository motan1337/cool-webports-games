<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Five Nights at Freddy's</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #eee; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; height: 100dvh; overflow: hidden; font: 15px Consolas, monospace; }
    #stage { display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; min-width: 0; min-height: 0; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 16 / 9; touch-action: none; }
    #gate { position: absolute; inset: 0; display: grid; place-content: center; padding: 28px; background: #000; text-align: center; }
    #gate p { max-width: 550px; line-height: 1.6; }
    button, a { color: inherit; font: inherit; }
    button { border: 1px solid #777; background: #191919; padding: 10px 16px; cursor: pointer; }
    footer { display: flex; align-items: center; gap: 12px; padding: 6px max(12px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)); flex-wrap: wrap; font-size: 12px; }
    footer button { padding: 5px 10px; } #message { flex: 1; margin: 0; }
    [hidden] { display: none !important; }
    #error { position: absolute; inset: 0; margin: 0; background: #000e; padding: 24px; white-space: pre-wrap; overflow: auto; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720" tabindex="-1" aria-label="Five Nights at Freddy's game"></canvas>
        <div id="gate"><div><p>Five Nights at Freddy's</p><p>This game contains flashing lights, loud noises, and jumpscares. Please use headphones for the best experience.</p><button id="start">Play</button><p>Touch or mouse to select. Move toward either side to look around the office. Tap or swing mouse for monitor bar to raise or lower.</p></div></div>
    <pre id="error" hidden></pre>
  </div>
  <footer><button id="pause">Pause</button><button id="fullscreen">Full screen</button><p id="message">Ready to play.</p></footer>
  <script src="game-data.js"></script>
  <script src="runtime.js"></script>
  <script src="panorama.js"></script>
  <script src="player.js"></script>
</body>
</html>
